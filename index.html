<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de CVs con IA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background-color: #f4f7f6; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 1rem; }
        input[type="text"], textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #3498db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; margin-top: 1.5rem; font-size: 1rem; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .result { margin-top: 2rem; padding: 1.5rem; background: #e8f4f8; border-radius: 8px; border-left: 5px solid #3498db; display: none; }
        .skill-tag { display: inline-block; background: #2ecc71; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; margin: 0.25rem; font-size: 0.9rem; font-weight: bold; }
        .error { color: #e74c3c; margin-top: 1rem; font-weight: bold; text-align: center; }
        .redacted { margin-top: 1rem; padding: 1rem; background: #fff; border-radius: 6px; font-style: italic; color: #555; border: 1px dashed #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Analizador de CVs con IA</h1>
        
        <label for="token">🔑 Token JWT (Cópialo de /usuarios/login en Swagger):</label>
        <input type="text" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        
        <label for="cvText">📄 Texto del Currículum:</label>
        <textarea id="cvText" placeholder="Pega aquí el texto del CV...">Ingeniero de Software con 4 años de experiencia. Experto en arquitectura de microservicios con Python, FastAPI y Docker. He liderado migraciones de bases de datos a PostgreSQL y AWS. Habilidades blandas: liderazgo de equipos ágiles, comunicación efectiva y resolución de problemas.</textarea>
        
        <button id="processBtn" onclick="procesarCV()">🚀 Procesar con IA</button>
        
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <h3>✅ Resultado del Análisis:</h3>
            <p><strong>Habilidades detectadas:</strong></p>
            <div id="skillsContainer"></div>
            <div id="redactedBox" class="redacted" style="display: none;">
                <strong>🔒 Texto con datos sensibles redactados:</strong><br>
                <span id="redactedText"></span>
            </div>
        </div>
    </div>

    <script>
        async function procesarCV() {
            const token = document.getElementById('token').value.trim();
            const cvText = document.getElementById('cvText').value.trim();
            const btn = document.getElementById('processBtn');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const skillsContainer = document.getElementById('skillsContainer');
            const redactedBox = document.getElementById('redactedBox');
            const redactedText = document.getElementById('redactedText');

            if (!token) { errorDiv.textContent = "⚠️ Por favor, ingresa tu Token JWT."; return; }
            if (!cvText) { errorDiv.textContent = "⚠️ Por favor, ingresa el texto del CV."; return; }

            btn.disabled = true;
            btn.textContent = "⏳ Analizando con IA...";
            errorDiv.textContent = "";
            resultDiv.style.display = "none";

            try {
                const response = await fetch("https://cv-api-1-ps8r.onrender.com/cvs/procesar-ia", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ texto_cv: cvText })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Error desconocido al procesar el CV");
                }

                // Mostrar skills
                skillsContainer.innerHTML = "";
                if (data.skills_extraidas && data.skills_extraidas.length > 0) {
                    data.skills_extraidas.forEach(skill => {
                        const span = document.createElement("span");
                        span.className = "skill-tag";
                        span.textContent = skill;
                        skillsContainer.appendChild(span);
                    });
                } else {
                    skillsContainer.innerHTML = "<p>No se encontraron habilidades claras.</p>";
                }

                // Mostrar texto redactado si la IA lo devolvió
                if (data.texto_redactado) {
                    redactedText.textContent = data.texto_redactado;
                    redactedBox.style.display = "block";
                } else {
                    redactedBox.style.display = "none";
                }

                resultDiv.style.display = "block";

            } catch (err) {
                errorDiv.textContent = "❌ Error: " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 Procesar con IA";
            }
        }
    </script>
</body>
</html>
